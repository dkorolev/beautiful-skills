# .scsh.yml — beautiful-skills: a source repo of standalone coding-agent skills.
#
# Install into any repository with one command:
#   scsh installskills https://github.com/dkorolev/beautiful-skills
# That copies each skill into the target's .skills/, wires the per-harness discovery
# symlinks (.claude/skills, .codex/skills, .cursor/skills, ...), gitignores tmp/, and merges
# these entries into the target's own .scsh.yml. So this repo ships no symlinks itself — scsh
# does that heavy lifting in the consumer; it keeps a local tmp/ .gitignore only for in-repo sanity.
#
# Each skill sits under its OWN profile, so a bare `scsh run` is a no-op (it just lists the
# profiles); run one explicitly with `scsh run <skill>`. Skills-only manifest: scsh supplies
# the base image, so there are no version/project/image headers. Each `result` is the report
# the skill writes under the gitignored tmp/.

skills:
  big-beautiful-build:
    harness: codex
    model: gpt-5.6-terra
    effort: high
    timeout: 1200
    profile: big-beautiful-build
    result: tmp/big-beautiful-build.md
  fast-gorgeous-forward:
    harness: codex
    model: gpt-5.6-terra
    effort: high
    timeout: 1200
    profile: fast-gorgeous-forward
    result: tmp/fast-gorgeous-forward.md
  code-gorgeous-review:
    harness: codex
    model: gpt-5.6-terra
    effort: high
    timeout: 1200
    # Keep the agent-facing wrapper out of the reviewer fleet's code-gorgeous-review profile.
    # Humans normally invoke this skill as /code-gorgeous-review; this distinct profile is
    # available only for callers that explicitly want scsh to launch the wrapper itself.
    profile: code-gorgeous-review-driver
    result: tmp/code-gorgeous-review.md
  prepare-gorgeous-pr:
    harness: codex
    model: gpt-5.6-terra
    effort: high
    timeout: 1200
    profile: prepare-gorgeous-pr
    result: tmp/prepare-gorgeous-pr.md
  the-gorgeous-loop:
    harness: codex
    model: gpt-5.6-terra
    effort: high
    timeout: 1200
    profile: the-gorgeous-loop
    result: tmp/the-gorgeous-loop.md
  send-gorgeous-pr:
    harness: codex
    model: gpt-5.6-terra
    effort: high
    timeout: 1200
    profile: send-gorgeous-pr
    result: tmp/send-gorgeous-pr.md
  kickoff-gorgeous-pipeline:
    harness: codex
    model: gpt-5.6-terra
    effort: high
    timeout: 1200
    profile: kickoff-gorgeous-pipeline
    result: tmp/kickoff-gorgeous-pipeline.md
  # Authoring-only family auditor. NEVER installed into a target repo: excluded both by its
  # `internal-` name and by an explicit `autoinstall: false`. Run with `scsh run --profile internal-self-check`.
  internal-self-check-beautiful-skills:
    harness: codex
    model: gpt-5.6-terra
    effort: high
    timeout: 600
    profile: internal-self-check
    autoinstall: false
    result: tmp/internal-self-check-beautiful-skills.json
